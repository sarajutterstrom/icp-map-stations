/* Responsive filter controls.
   The filters are a compact overlay on large maps, but collapse to a
   small button when the map is embedded in a narrow page/iframe. */
.filter-toggle {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10001;
    border: 1px solid #777;
    background: white;
    border-radius: 6px;
    padding: 7px 10px;
    cursor: pointer;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
    font-size: 13px;
    font-weight: 600;
}
.filter-panel {
    position: fixed;
    top: 52px;
    left: 12px;
    width: min(250px, calc(100% - 24px));
    max-height: min(70vh, calc(100% - 64px));
    overflow-y: auto;
    z-index: 10000;
    background: white;
    border: 2px solid #777;
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
    font-size: 13px;
    line-height: 1.45;
    display: none;
}
.filter-panel.open {
    display: block;
}

/* Narrow embedded maps: use a smaller panel when opened. */
@media (max-width: 699px) {
    .filter-panel {
        top: 50px;
        left: 8px;
        width: min(220px, calc(100% - 16px));
        max-height: calc(100% - 58px);
        padding: 10px 11px;
        font-size: 12px;
    }

    .filter-toggle {
        top: 8px;
        left: 8px;
    }
}
.filter-panel h4 {
    margin: 0 0 10px 0;
    font-size: 15px;
}
.filter-group {
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e1e1e1;
}
.filter-group:last-child {
    border-bottom: none;
    margin-bottom: 8px;
}
.filter-subtitle {
    font-weight: 700;
    margin-bottom: 8px;
}
.filter-option {
    display: block;
    margin-bottom: 6px;
}
.filter-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.filter-buttons button {
    border: 1px solid #999;
    background: #f5f5f5;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
}
.station-count {
    margin-top: 8px;

    color: #333;
}
.popup-block {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #ececec;
}
